name: TestFlight feedback

# Fetches what testers send from TestFlight: feedback with screenshots and crash reports with
# their crash logs (.github/scripts/asc_feedback.py, App Store Connect API). Daily at 06:00 UTC
# (schedules only run from the default branch) and by hand. Its own App Store Connect key, not the
# upload's: the upload key (Admin) is an environment secret of testflight-upload that only the
# upload job of testflight.yml gets (test_workflows.py checks that no other job names it). This key needs the role
# Developer (Admin or App Manager would work too, but can do more than reading feedback) and is
# kept as three repository secrets ASC_FEEDBACK_KEY_ID, ASC_FEEDBACK_ISSUER_ID and
# ASC_FEEDBACK_KEY_P8 (docs/launch/FREIGABE_EINRICHTEN.md, optional step). Without them the run
# stops after one quick check.
#
# Three modes. "encrypted" is the schedule and the default: comments, device data, screenshots and
# crash logs of the last 14 days are packed into one tar under $RUNNER_TEMP and encrypted with
# openssl cms (RSA-OAEP SHA-256, AES-256-CBC) to the certificate .github/feedback-recipient.pem.
# The script refuses (exit 5) before fetching anything unless that certificate's SHA-256 equals
# the value pinned in asc_feedback.py (RECIPIENT_SHA256), so a swapped certificate in a pull
# request fails instead of sending the feedback to someone else. The plaintext is overwritten and
# deleted by the script before this step ends (and removed again below if the step was killed);
# only the .cms file is uploaded (artifact testflight-feedback-encrypted, 14 days), so this mode
# is allowed while the repository is public. Its private key is never in the repository or on a
# runner; tools/feedback_inbox.py decrypts a downloaded artifact locally into a Markdown inbox
# and de-duplicates by submission id (every run sends the whole 14 days again).
# "counts": the job summary shows only how many feedback and crash submissions each build has.
# No comment, device data, screenshot or crash log is fetched, written or uploaded.
# "full" (comments, screenshots, crash logs in report.md inside a plain artifact kept 7 days) is
# refused by the script itself unless the GitHub API reports this repository as private: while it
# is public, anyone can read job summaries and any signed-in GitHub user can download artifacts,
# and screenshots of a photo app may show the testers' own photos.
# In every mode the job summary (kept ~90 days) shows only the counts. An artifact is only
# uploaded when the script says so (step output mode=full or mode=encrypted, written after the
# file is checked), never because of the input alone.
# API calls never follow redirects (asc_feedback.py).
# GitHub turns the schedule off after 60 days without activity in a public repository; then
# Actions > TestFlight feedback > "Enable workflow".
#
# Everything testers send is untrusted text. It only ever travels in files: never in ${{ }}
# expressions, shell commands or the log (a log line starting with "::" would be a command).
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      report:
        description: 'Inhalt: encrypted = alles der letzten 14 Tage, verschlüsselt (tools/feedback_inbox.py); counts = nur Anzahlen je Build; full = Kommentare, Screenshots, Absturzprotokolle unverschlüsselt (nur bei privatem Repository)'
        type: choice
        options: [encrypted, counts, full]
        default: encrypted

permissions:
  contents: read

concurrency:
  group: asc-feedback
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch TestFlight feedback and crashes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: App Store Connect secrets present
        id: secrets
        env:
          KEY_ID: ${{ secrets.ASC_FEEDBACK_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_FEEDBACK_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_FEEDBACK_KEY_P8 }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: the feedback key is not set (ASC_FEEDBACK_KEY_ID, ASC_FEEDBACK_ISSUER_ID, ASC_FEEDBACK_KEY_P8; docs/launch/FREIGABE_EINRICHTEN.md)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ready == 'true'
        with:
          # Cone mode: also the files right in .github/, among them feedback-recipient.pem.
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: App Store Connect key
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEY_P8: ${{ secrets.ASC_FEEDBACK_KEY_P8 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
      - name: Fetch feedback and crash logs
        id: fetch
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_FEEDBACK_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_FEEDBACK_ISSUER_ID }}
          KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          # Read by the script to ask GitHub whether the repository is private (mode full only).
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.report || 'encrypted' }}
        run: |
          python3 .github/scripts/asc_feedback.py --bundle-id app.albumist.ios \
            --out "$RUNNER_TEMP/feedback" --encrypted-out "$RUNNER_TEMP/feedback-encrypted" \
            --recipient .github/feedback-recipient.pem --days 14 \
            --summary "$GITHUB_STEP_SUMMARY" --mode "$MODE"
      - name: Remove key and plaintext
        if: always()
        # The script wipes its plaintext folder itself; this only catches a killed step.
        run: rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP"/feedback-plain-*
      - name: Keep the encrypted report
        if: always() && steps.fetch.outputs.mode == 'encrypted'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-feedback-encrypted
          path: ${{ runner.temp }}/feedback-encrypted/*.cms
          retention-days: 14
          if-no-files-found: error
          overwrite: true
      - name: Keep report, screenshots and crash logs
        if: always() && steps.fetch.outputs.mode == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-feedback
          path: ${{ runner.temp }}/feedback
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
