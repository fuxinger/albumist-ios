name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      appetize:
        # The free Appetize minutes are used up, so the browser-test upload no longer runs on
        # every push (it held a macOS runner for ~4 min each time). Kept for a manual run.
        description: Also build the simulator app and upload it to Appetize
        type: boolean
        default: false

# Read-only token: no job writes to the repository.
permissions:
  contents: read

env:
  # brew would otherwise update itself first (about a minute per macOS job).
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

# A new push to the same branch or PR cancels the run of the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Fast checks that need no compiler; they fail within seconds.
    name: App rules and strings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Navigation rule
        # Navigation uses destination-based links only. A value-based link inside a screen that
        # was itself pushed by a destination-based link leads nowhere (dead row, warning triangle).
        run: |
          if grep -rn "NavigationLink(value:" App/Sortly; then
            echo "::error::Use NavigationLink { destination } label: { … } instead of NavigationLink(value:)"
            exit 1
          fi
      - name: Every UI string has English
        run: python3 .github/scripts/check_strings.py .
      - name: Code map lists every Swift file
        run: python3 scripts/gen_codemap.py --check
      - name: CI scripts (unit tests)
        # The retry rule of the UI jobs (ui_tests.py) and the test gate (ci_gate.py), with log
        # snippets of real runs: a simulator failure is repeated, a real finding never.
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Test-plan map names real tests
        # Warnings only: a stale name in docs/TEST_COVERAGE_MAP.txt makes a case look untested
        # in the job summary, it does not make the app worse.
        run: python3 .github/scripts/test_summary.py map-check

  changes:
    # Decides whether the macOS job has to run: it is skipped when only *.md / docs/ changed
    # since the last commit whose iOS tests passed (pull_request path filters cannot do this,
    # they look at the whole PR diff).
    name: Changes
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      actions: read

  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SQLite headers
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev python3 > /dev/null
      - name: Content-based file times (lets the build cache work, see the script)
        run: python3 .github/scripts/stable_mtimes.py .
      - name: Toolchain
        id: toolchain
        run: echo "id=$(swift --version 2>&1 | head -1 | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      # SwiftPM's .build from an earlier run. The key only picks the starting point: the
      # compiler still checks every source (content-based times), so a stale entry costs time,
      # never correctness. The nightly run builds without any cache.
      - name: Build cache
        # Off since 16.11.: a restored cache hid a change in SortlyCore (CI 43796841063: 'AlbumMatcher has no member tiedWithBest' although Linux built it). Back on only with a proven fix.
        if: ${{ false }}
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-linux-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: spm-linux-${{ steps.toolchain.outputs.id }}-
      - name: Build and test
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee core-linux.log
      - name: Load test (20,000 and 100,000 photos, time and memory limits)
        run: |
          set +e
          SORTLY_LOAD_TEST=1 swift test --skip-build --filter LoadTests > load.log 2>&1
          status=$?
          grep -E "LOAD_|passed|failed|error" load.log
          exit $status
      - name: Job summary
        if: always()
        run: |
          python3 .github/scripts/test_summary.py summary --title "Core tests (Linux)" \
            --swift-log core-linux.log --swift-log load.log --load-log load.log >> "$GITHUB_STEP_SUMMARY" || true
      # Saved also when a test failed: the build products are valid either way, and the next
      # run (usually the fix) starts from them.
      - name: Save build cache
        if: ${{ false }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  names:
    # App name candidates against the App Store (the API is only reachable from CI).
    name: App name check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .github/scripts/name_check.py docs/launch/name-candidates.txt

  ios:
    name: iOS build and tests (macOS)
    # Fast first, then expensive (Fuchs 15.11.): the Mac job starts only when the Linux core
    # tests and the app rules passed. It still runs unless the changes job positively found a
    # docs-only change (also when that job failed).
    needs: [changes, lint, core-linux]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.lint.result == 'success' && needs.core-linux.result == 'success' }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Xcode
        id: xcode
        # Xcode and simulator runtime pinned in .github/toolchain.json; the job stops when the
        # image lacks them. The id output (Xcode version and build) is part of the cache key:
        # products of another compiler are never reused.
        run: |
          python3 .github/scripts/toolchain.py xcode --runtime
          # Files restored from the cache have new inode numbers; without this Xcode's build
          # system would treat all of them as changed and rebuild everything.
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
      - name: Generate Xcode project
        if: hashFiles('App/project.yml') != ''
        run: |
          brew install xcodegen
          cd App && xcodegen generate
      - name: Content-based file times (lets the build cache work, see the script)
        run: python3 .github/scripts/stable_mtimes.py .
      # DerivedData (app, package and SDK modules) and SwiftPM's .build from an earlier run.
      # The key only picks the starting point; the build system still checks every input, and
      # source files carry content-based times, so a changed file is always recompiled. The
      # nightly run builds without any cache to catch an incremental-build problem within a day.
      - name: Build cache
        # Off since 16.11.: a restored cache hid a change in SortlyCore (CI 43796841063: 'AlbumMatcher has no member tiedWithBest' although Linux built it). Back on only with a proven fix.
        if: ${{ false }}
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            .build
          key: ios-${{ runner.arch }}-${{ steps.xcode.outputs.id }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**', 'App/**') }}
          restore-keys: ios-${{ runner.arch }}-${{ steps.xcode.outputs.id }}-
      - name: Pick simulator
        if: hashFiles('App/project.yml') != ''
        id: sim
        # Not booted early on purpose: a first boot competes with the package build for the
        # three cores and made both several minutes slower (run 43749559109).
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 .github/scripts/pick_simulator.py --role default)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Core tests (macOS)
        run: |
          set -o pipefail
          mkdir -p build
          swift test --parallel 2>&1 | tee build/core-macos.log
      - name: Build and test app
        if: hashFiles('App/project.yml') != ''
        run: |
          set +e
          cd App
          xcodebuild test \
            -project Sortly.xcodeproj \
            -scheme Sortly \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath ../build/TestResults.xcresult \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO > ../build-log.txt 2>&1
          status=$?
          grep -E "error:|warning: .*Sortly|Test Suite|Test case|Executed|TAXONOMY|VISION_IDENTIFIERS|PREVIEW_JPEG|\*\* |✘|recorded an issue|Test run with|Testing failed|Fatal error|crashed" ../build-log.txt | grep -v "/SourcePackages/" | head -3000
          exit $status
      - name: Build UI tests
        # The UI tests run in their own workflow (ui.yml); building them here finds a compile
        # error in them within this run instead of after the long simulator setup there.
        if: hashFiles('App/project.yml') != ''
        run: |
          cd App
          xcodebuild build-for-testing \
            -project Sortly.xcodeproj \
            -scheme SortlyUI \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO > ../build-ui-log.txt 2>&1 \
            || { grep -E "error:" -A3 ../build-ui-log.txt | grep -v "/SourcePackages/" | head -80; exit 1; }
          grep -E "warning: .*SortlyUITests" ../build-ui-log.txt | head -40 || true
          tail -2 ../build-ui-log.txt
      - name: Export strings for translation
        if: success() && hashFiles('App/project.yml') != ''
        run: |
          cd App
          xcodebuild -exportLocalizations -project Sortly.xcodeproj -localizationPath ../build/loc -exportLanguage en CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO | tail -3
          find ../build/loc -name "*.xliff" -exec sh -c 'base64 -i "$1" | tr -d "\n" | fold -w 4000 | sed "s/^/XLIFF /"' _ {} \;
      - name: Upload strings
        if: success() && hashFiles('build/loc/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: localizations
          path: build/loc
          retention-days: 7
      - name: Job summary
        if: always()
        run: |
          xcrun xcresulttool get test-results tests --path build/TestResults.xcresult > build/app-tests.json 2>/dev/null || true
          python3 .github/scripts/test_summary.py summary --title "iOS build and tests (macOS)" \
            --swift-log build/core-macos.log --xcresult-json build/app-tests.json >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload logs
        if: always() && hashFiles('build-log.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-log
          path: |
            build-log.txt
            build/TestResults.xcresult
          retention-days: 7
      # Saved also when a test failed: the build products are valid either way, and the next
      # run (usually the fix) starts from them. Logs and the index are left out.
      - name: Keep the build cache small
        if: ${{ false }}
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*/Logs ~/Library/Developer/Xcode/DerivedData/*/Index.noindex
      - name: Save build cache
        if: ${{ false }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            .build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  simulator:
    # Manual only (workflow_dispatch input "appetize"): builds the simulator app and uploads it
    # to Appetize for browser testing.
    name: Simulator app for browser testing
    if: github.event_name == 'workflow_dispatch' && inputs.appetize
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Xcode
        run: python3 .github/scripts/toolchain.py xcode
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd App && xcodegen generate
      - name: Build simulator app for browser testing
        run: |
          set -o pipefail
          mkdir -p build
          cd App
          xcodebuild build \
            -project Sortly.xcodeproj \
            -scheme Sortly \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ../build/sim \
            CODE_SIGNING_ALLOWED=NO > ../build/sim-build.log 2>&1 \
            || { grep -E "error:" -A3 ../build/sim-build.log | head -60; exit 1; }
          tail -5 ../build/sim-build.log
          cd ../build/sim/Build/Products/Release-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Sortly.app ../../../../Sortly-simulator.zip
          ls -la ../../../../Sortly-simulator.zip
      - name: Upload simulator app
        if: success() && hashFiles('build/Sortly-simulator.zip') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sortly-simulator-app
          path: build/Sortly-simulator.zip
          retention-days: 30
      - name: Upload to Appetize for browser testing
        # Runs only when the repository has the secret APPETIZE_TOKEN. Keeps one app
        # (note "sortly-ci") and updates it, so the test link stays the same.
        if: success() && hashFiles('build/Sortly-simulator.zip') != ''
        continue-on-error: true
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}
        run: |
          if [ -z "$APPETIZE_TOKEN" ]; then echo "No APPETIZE_TOKEN secret, skipping."; exit 0; fi
          key=$(curl -sS -H "X-API-KEY: $APPETIZE_TOKEN" https://api.appetize.io/v1/apps \
            | jq -r '[.data[]? | select(.note == "sortly-ci")][0].publicKey // empty')
          url=https://api.appetize.io/v1/apps${key:+/$key}
          curl -sS --fail-with-body -X POST "$url" -H "X-API-KEY: $APPETIZE_TOKEN" \
            -F "file=@build/Sortly-simulator.zip" -F "platform=ios" -F "note=sortly-ci" > appetize.json
          key=$(jq -r '.publicKey' appetize.json)
          echo "APPETIZE_LINK https://appetize.io/app/$key"
          echo "### Im Browser testen: https://appetize.io/app/$key" >> "$GITHUB_STEP_SUMMARY"
