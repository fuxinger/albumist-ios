name: Simulator snapshot probe

# Stage 4, lever 1 of the rebuild (plan /mnt/project-files/sortly-review/bau-strecke/s4-plan-2026-11-27.md,
# 27.11.2026): measure first. Every UI group loses 3-6 min to the first boot of a never-booted
# simulator (data migration) and its preparation (photo access, status bar; run 45973048317).
# Would a booted, prepared and empty simulator, saved once and restored by every group, start
# faster? This probe answers it without touching any group: by hand only, two Macs one after the
# other, nothing else reads its result.
#   1. cold: the group's own boot (ui_tests.py boot, as in ui.yml), then shut down and pack the
#      simulator's data folder (size and time logged), and upload it like a cache would.
#   2. warm: on another runner, the same simulator is picked, the packed folder downloaded
#      (time logged) and unpacked in place of its data, then booted and prepared the same way.
# Compare the steps' times (job summary of both jobs). No app is in the snapshot, so a group's
# "never launched app" (onboarding test 1) would still hold; the photo access is for the bundle
# id only.
on:
  # Also on a pull request that changes this file (and only then): a workflow runs by hand only
  # from main's copy, and the probe should be measured before anything depends on it.
  pull_request:
    paths: ['.github/workflows/sim-snapshot-probe.yml']
  workflow_dispatch:
    inputs:
      device:
        description: Simulator of the probe (pro as in device, flow-full and flow-other; se as in accessibility and contrast)
        type: choice
        options: [pro, se]
        default: pro

permissions:
  contents: read

concurrency:
  group: sim-snapshot-probe
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  DEVICE: ${{ inputs.device || 'pro' }}

jobs:
  cold:
    name: Cold boot and snapshot
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: python3 .github/scripts/toolchain.py xcode --runtime
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(python3 .github/scripts/ui_tests.py pick --device "$DEVICE")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Boot and prepare (cold)
        run: python3 .github/scripts/ui_tests.py boot --udid "${{ steps.sim.outputs.udid }}"
      - name: Shut down and pack the data folder
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl shutdown "$UDID"
          dir="$HOME/Library/Developer/CoreSimulator/Devices/$UDID"
          echo "SNAPSHOT data folder: $(du -sh "$dir/data" | cut -f1)"
          started=$(date +%s)
          tar -C "$dir" -czf snapshot.tgz data
          echo "SNAPSHOT packed in $(( $(date +%s) - started )) s: $(ls -lh snapshot.tgz | awk '{print $5}')"
          echo "- cold: data $(du -sh "$dir/data" | cut -f1), packed $(ls -lh snapshot.tgz | awk '{print $5}')" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-snapshot
          path: snapshot.tgz
          retention-days: 1
          compression-level: 0
          overwrite: true

  warm:
    name: Warm boot from the snapshot
    needs: cold
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: python3 .github/scripts/toolchain.py xcode --runtime
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(python3 .github/scripts/ui_tests.py pick --device "$DEVICE")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Download the snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sim-snapshot
          path: snapshot-download
      - name: Unpack in place of the data folder
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl shutdown "$UDID" > /dev/null 2>&1 || true
          dir="$HOME/Library/Developer/CoreSimulator/Devices/$UDID"
          started=$(date +%s)
          rm -rf "$dir/data"
          tar -C "$dir" -xzf snapshot-download/snapshot.tgz
          echo "SNAPSHOT unpacked in $(( $(date +%s) - started )) s: data $(du -sh "$dir/data" | cut -f1)"
      - name: Boot and prepare (warm)
        run: python3 .github/scripts/ui_tests.py boot --udid "${{ steps.sim.outputs.udid }}"
      - name: Times of both boots
        if: always()
        run: |
          echo "Compare the step times of \"Boot and prepare (cold)\" and \"Boot and prepare (warm)\" plus download and unpack;" \
            "the TIMING lines in both logs split boot, photo access and status bar." >> "$GITHUB_STEP_SUMMARY"
