name: TestFlight

# Builds a signed App Store build and uploads it to TestFlight, so Albumist can be installed on
# a real iPhone (docs/TESTFLIGHT.md). One run does it all for one commit (Profi-Analyse 16.11.,
# Top 10 / G8, decided 17.11.): it tests exactly that commit itself and, only when every test is
# green, archives, uploads and tags it. No job waits for or looks at other workflow runs.
#
#   1. TestFlight secrets: without the four App Store Connect secrets (docs/TESTFLIGHT.md), or
#      on another branch, the run stops here, before any macOS minute.
#   2. Tests: CI (ci.yml) with the app rules, the Linux core tests and then, on one Mac, the
#      iOS build, core and app tests. Its iOS job always runs here.
#   3. Then side by side: the UI flow (ui.yml, five groups, at most four Macs) and the small
#      stress pass (ui-stress.yml: 10,000 photos, 15 min measured; the owner's rule 17.11.:
#      before each TestFlight build). Five Macs at the peak.
#   4. Archive and upload, one Mac job, only when 2 and 3 are green: archives exactly this
#      commit with the pinned Xcode and this run's number as the build number, checks the
#      app's Info.plist (commit, build number, Xcode build), signs it for the App Store during
#      the export and uploads it. Archive and export happen in the same job: nothing is handed
#      between machines, so the app that is uploaded is the one built from the tested commit.
#   5. The commit gets the git tag build-<number>; "Was testen" is set from
#      docs/TESTFLIGHT_NOTES.md.
# About two hours in all (CI ~20 min, UI flow ~70 min, archive and upload ~15 min).
#
# Every part tests this run's commit (github.sha). The called workflows get a concurrency group
# of their own for this run: the Mac queue of ui.yml never holds or replaces them, and a push to
# main never cancels them. Start a TestFlight run when the Mac queue is idle (one Mac-heavy
# strand at a time). After a failure, "Re-run failed jobs" starts the failed parts again; no
# release archive has to survive between jobs.
#
# Started by hand only: Actions > TestFlight > Run workflow on main
# (gh workflow run testflight.yml --ref main). No push or merge starts a build.
# claude/sortly-app is still accepted until it is retired (Profi-Analyse Top 1).
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Emergency: upload without running the tests'
        type: boolean
        default: false

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

# One TestFlight run at a time and none is cancelled: a second run waits (a third one would
# replace the waiting second), so builds reach App Store Connect in the order of their numbers.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  check:
    name: TestFlight secrets
    # The App Store Connect secrets are only ever read on the release branch, in a run started
    # by someone with write access; this workflow has no pull_request trigger.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/sortly-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_P8" ] && [ -n "$TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TestFlight skipped: the App Store Connect secrets are not set yet (docs/TESTFLIGHT.md)."
          fi
      - name: Forced upload
        if: inputs.force && steps.secrets.outputs.ready == 'true'
        run: echo "::warning title=Forced::Uploading without running the tests (manual run with force)."

  tests:
    name: Tests
    needs: check
    if: needs.check.outputs.ready == 'true' && !inputs.force
    uses: ./.github/workflows/ci.yml
    with:
      release: true
    # CI's changes job (changes.yml) asks for actions: read; it is skipped here, but a called
    # workflow may never ask for more than its caller grants.
    permissions:
      contents: read
      actions: read

  ui:
    name: UI flow
    needs: tests
    uses: ./.github/workflows/ui.yml
    with:
      release: true

  stress:
    name: Stress pass
    needs: tests
    uses: ./.github/workflows/ui-stress.yml
    with:
      release: true

  release:
    name: Archive and upload to TestFlight
    needs: [check, tests, ui, stress]
    # The tests, the UI flow and the stress pass of this run must all be green (or skipped on
    # purpose by force). !cancelled() instead of the default: with force, skipped jobs must not
    # skip this one.
    if: >-
      ${{ !cancelled() && needs.check.outputs.ready == 'true' && (inputs.force
      || (needs.tests.result == 'success' && needs.ui.result == 'success' && needs.stress.result == 'success')) }}
    runs-on: xcode-27
    # Archive ~10-20 min, export and upload ~3-5 min.
    timeout-minutes: 60
    # The App Store Connect key reaches this job only after the archive is built: its ids are
    # in the upload step's environment, the private key is written to disk in the step before
    # the export and removed right after it. The build steps (the repository's own code, no
    # third-party packages; xcodegen from Homebrew as in every Mac job) never have them, but
    # unlike the two Mac jobs before 17.11. they run on the same machine as the export.
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; no token stays in .git/config next to the build.
          persist-credentials: false
      - name: Select pinned Xcode
        # The pinned release Xcode (.github/toolchain.json), never a beta: App Store Connect
        # refuses beta builds.
        run: python3 .github/scripts/toolchain.py xcode
      - name: Paths
        run: |
          {
            echo "ARCHIVE=$RUNNER_TEMP/Albumist.xcarchive"
            echo "KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8"
            echo "EXPORT_OPTIONS=$RUNNER_TEMP/ExportOptions.plist"
          } >> "$GITHUB_ENV"
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd App && xcodegen generate
      # The archive is built unsigned: automatic signing would want a development profile,
      # and Apple only makes one when an iPhone is registered to the team. The export below
      # signs for the App Store with Apple's cloud-managed distribution certificate (needs the
      # Admin key), which works without any registered device. DEVELOPMENT_TEAM stays in the
      # archive because the export has only been proven with it (a team id is not secret).
      # The build number is this workflow's run number: it only grows (build 27 was run 27).
      - name: Archive (unsigned; signed for the App Store during export)
        run: |
          cd App
          set +e
          xcodebuild archive \
            -project Sortly.xcodeproj \
            -scheme Sortly \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ALBUMIST_COMMIT="$GITHUB_SHA" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" > ../archive-log.txt 2>&1
          status=$?
          grep -E "error:|\*\* ARCHIVE" ../archive-log.txt | head -80
          exit $status
      - name: Archive of the tested commit
        # The checkout is this run's commit, and the app's own Info.plist says so too: it names
        # the commit (AlbumistCommit), this run's build number (CFBundleVersion) and the build of
        # the pinned Xcode (DTXcodeBuild), see .github/scripts/archive_check.py.
        run: |
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "::error::checkout is not $GITHUB_SHA"; exit 1; }
          python3 .github/scripts/archive_check.py "$ARCHIVE" --sha "$GITHUB_SHA" --build "${{ github.run_number }}" --pinned-xcode
      - name: App Store Connect key
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          plutil -create xml1 "$EXPORT_OPTIONS"
          plutil -insert method -string app-store-connect "$EXPORT_OPTIONS"
          plutil -insert destination -string upload "$EXPORT_OPTIONS"
          plutil -insert signingStyle -string automatic "$EXPORT_OPTIONS"
          plutil -insert teamID -string "$TEAM_ID" "$EXPORT_OPTIONS"
          plutil -insert uploadSymbols -bool YES "$EXPORT_OPTIONS"
          set +e
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" > upload-log.txt 2>&1
          status=$?
          grep -E "error:|Upload|EXPORT|\*\* " upload-log.txt | head -80
          [ $status -eq 0 ] && echo "TESTFLIGHT_BUILD ${{ github.run_number }} uploaded; it appears in TestFlight after Apple's processing (usually 5 to 30 minutes)."
          [ $status -eq 0 ] && echo "### TestFlight build ${{ github.run_number }} uploaded (${GITHUB_SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Remove key
        if: always()
        run: rm -rf "$(dirname "$KEY_PATH")"

  tag:
    # Every uploaded build has a git tag build-<number> on exactly the commit it was built from,
    # so "which code is TestFlight build 41?" is `git show build-41`. The only job of this
    # workflow that may write to the repository, and it can only create a tag: an existing tag
    # is left alone when it is on the same commit (a re-run) and fails the job otherwise.
    name: Tag the TestFlight build
    needs: release
    # Not the default success(): it would also look at the tests, which force skips.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag build-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            [ "$existing" = "$GITHUB_SHA" ] \
              || { echo "::error::$TAG already points at $existing, not at $GITHUB_SHA; left as it is"; exit 1; }
            echo "$TAG is already on ${GITHUB_SHA:0:7}"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
            echo "Tagged ${GITHUB_SHA:0:7} as $TAG"
          fi
          echo "Git tag \`$TAG\` on ${GITHUB_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"

  notes:
    # Sets the German "Was testen" text from docs/TESTFLIGHT_NOTES.md once App Store Connect
    # knows the build (bounded wait on a Linux runner, so no macOS runner is held). A failure
    # here never touches the upload, which is done already.
    name: What to Test
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set "Was testen" for this build
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          export KEY_PATH="$RUNNER_TEMP/asc/AuthKey.p8"
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          python3 .github/scripts/testflight_notes.py upload --notes docs/TESTFLIGHT_NOTES.md \
            --build "${{ github.run_number }}" --sha "$GITHUB_SHA" --bundle-id app.albumist.ios --wait-minutes 40
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
