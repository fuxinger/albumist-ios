name: TestFlight

# main holds an old app state (15.11.) and is never built or uploaded from this file.
#
# Until 18.11. this file started a signed build and a TestFlight upload on every push to main,
# without any test: merging the website into main on 16.11. started a build of the old state
# (run 43951836909, cancelled by hand). Such a build would have reached TestFlight with a higher
# build number than the tested one and replaced it on the testers' iPhones (Fable analysis
# 18.11., finding P5-15).
#
# Now:
#   - No push, merge or pull request starts this workflow; it can only be started by hand.
#   - A run on main stops at once on Linux and uploads nothing. It reads no secret, uses no Mac
#     and has no concurrency group, so it cannot cancel or hold a real TestFlight run elsewhere.
#   - A run started by hand on another branch uses that branch's own testflight.yml (GitHub
#     always runs the workflow file of the branch it runs on), so the release branches keep
#     their own test gate. This file stays here so "Run workflow" remains in the Actions tab.
#
# This file is replaced by the tested pipeline (claude/next: tests, UI flow, stress pass and
# UI gate before any upload) when that is merged into main.
on:
  workflow_dispatch:

permissions: {}

jobs:
  refuse:
    name: No upload from main
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Stop
        run: |
          echo "::error title=No TestFlight upload from main::main holds an old, untested app state. Start TestFlight on the release branch instead; its own workflow tests the commit before any upload."
          exit 1
