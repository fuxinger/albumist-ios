name: TestFlight

# This branch (claude/sortly-app) is the old release branch: build 36 (tag build-36 = 4bb7fdd)
# came from here. It no longer uploads anything (decision by Fuchs, 18.11.2026, after the
# ChatGPT review: "upload there switched off, branch not deleted").
#
# Until 18.11. this file started a signed build and a TestFlight upload on every push to this
# branch, with the old test gate and the emergency "force" switch that skipped the tests. The
# release path is now main: tests, UI flow, stress pass and UI gate before any upload, and no
# way to skip them.
#
# Now:
#   - No push, merge or pull request starts this workflow; it can only be started by hand.
#   - A run here stops at once on Linux and uploads nothing. It reads no secret, uses no Mac
#     and has no concurrency group, so it cannot cancel or hold a real TestFlight run elsewhere.
on:
  workflow_dispatch:

permissions: {}

jobs:
  refuse:
    name: No upload from the old release branch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Stop
        run: |
          echo "::error title=No TestFlight upload from claude/sortly-app::This old release branch no longer uploads. Start TestFlight on main; its workflow tests the commit before any upload."
          exit 1
