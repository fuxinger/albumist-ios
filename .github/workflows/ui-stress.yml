name: UI stress

# The 50,000-photo stress run of the app on the simulator: DeviceConditionUITests/test12
# creates that many photos (iCloud-only, offline) and measures the analysis for a while:
# speed, Pause reaction, how long a display stood still, and the app's memory (resident size
# of the simulator's app process on the Mac, sampled every 5 s and tagged with the test's
# phase). Too long for every UI run (creating the photos alone takes ~30 min), so it is not
# part of ui.yml: started by hand on the branch to measure
#   gh workflow run ui-stress.yml --ref BRANCH [-f photos=50000] [-f minutes=45]
# In the normal UI run (ui.yml, group "device conditions") test12 skips itself, because only
# this workflow sets SORTLY_STRESS_PHOTOS.
#
# One macOS job (builds the tests itself), with the pinned Xcode and runtime and the pinned
# Pro simulator (.github/toolchain.json, pick_simulator.py --role pro). It runs through
# .github/scripts/ui_tests.py like every UI group: same retry rule for a lost simulator, and
# the photo access is given back from the Mac when the test asks (UI_HOST_GRANT_PHOTOS).
on:
  workflow_dispatch:
    inputs:
      photos:
        description: Photos to create (iCloud-only, offline)
        type: string
        default: '50000'
      minutes:
        # The simulator's Vision needs about 8 h for 50,000 photos (a device is faster), so the
        # analysis is measured for this many minutes after the photos are created.
        description: Minutes of analysis measured after the photos are created
        type: string
        default: '45'

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

concurrency:
  group: ui-stress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    name: UI stress ${{ inputs.photos }} photos
    runs-on: xcode-27
    # Build ~10 min, simulator ~5 min, creating 50,000 photos ~30 min, measuring `minutes`;
    # the pass itself is stopped after 130 min so the diagnostics below still run.
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: python3 .github/scripts/toolchain.py xcode --runtime
      - name: Boot simulator (in the background)
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 .github/scripts/pick_simulator.py --role pro)
          [ -n "$UDID" ] || { echo "no simulator"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          nohup python3 .github/scripts/ui_tests.py boot --udid "$UDID" --ready-file sim-ready > sim-boot.log 2>&1 &
      - name: Build for testing
        run: |
          set +e
          brew install xcodegen
          cd App && xcodegen generate
          xcodebuild build-for-testing \
            -project Sortly.xcodeproj \
            -scheme SortlyUI \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ../build/dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO > ../build-log.txt 2>&1
          status=$?
          grep -aE "error:|\*\* " ../build-log.txt | grep -v "/SourcePackages/" | head -100
          exit $status
      - name: Wait for the simulator
        run: |
          for _ in $(seq 1 180); do [ -f sim-ready ] && break; sleep 5; done
          cat sim-boot.log
          [ "$(cat sim-ready 2>/dev/null)" = ok ] || { echo "simulator did not boot"; exit 1; }
      - name: Stress run
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          # xcodebuild hands TEST_RUNNER_* variables to the tests without the prefix.
          TEST_RUNNER_SORTLY_STRESS_PHOTOS: ${{ inputs.photos }}
          TEST_RUNNER_SORTLY_STRESS_MINUTES: ${{ inputs.minutes }}
        run: |
          set +e
          XCTESTRUN=$(ls build/dd/Build/Products/*.xctestrun 2>/dev/null | head -1)
          [ -n "$XCTESTRUN" ] || { echo "::error::no .xctestrun in the build products"; exit 1; }
          mkdir -p build
          LOG=build/stress-log.txt
          # Memory of the app process every 5 s, tagged with the test's phase (create / measure).
          echo prepare > phase.txt
          ( while true; do
              pid=$(pgrep -f "Sortly.app/Sortly" | head -1)
              [ -n "$pid" ] && echo "$(date +%s) $(ps -o rss= -p "$pid" | tr -d ' ') $(cat phase.txt)" >> memory.txt
              sleep 5
            done ) &
          SAMPLER=$!
          ( tail -n +1 -F "$LOG" 2>/dev/null | grep --line-buffered -ao "UI_STRESS_PHASE [a-z]*" | while read -r _ phase; do echo "$phase" > phase.txt; done ) &
          # Steps as they happen (ui_tests.py prints its report only at the end of the pass).
          tail -n +1 -F "$LOG" 2>/dev/null | grep --line-buffered -aE "error:|UI_STEP|UI_TIMING|UI_FACT|UI_STRESS|Test Case|Executed|\*\* |Testing failed|Fatal error|crashed|Restarting after" | grep --line-buffered -v "/SourcePackages/" | sed -u 's/^/STRESS_LIVE /' &
          started=$(date +%s)
          # Memory once a minute while it runs ("no app" when the last sample is older than 30 s).
          ( while true; do sleep 60
              tail -1 memory.txt 2>/dev/null | awk -v s="$started" -v now="$(date +%s)" '{ if (now-$1 > 30) printf "STRESS_MEMORY %d min no app (last %d MB, %s)\n", (now-s)/60, $2/1024, $3; else printf "STRESS_MEMORY %d min %d MB %s\n", (now-s)/60, $2/1024, $3 }'
            done ) &
          TICKER=$!
          ( sleep 7800; echo "::error::Stress run stopped after 130 minutes"; pkill -INT -f "xcodebuild test-without-building" ) &
          WATCHDOG=$!
          python3 .github/scripts/ui_tests.py run --udid "$UDID" --name stress --xctestrun "$XCTESTRUN" \
            --only DeviceConditionUITests/test12_StressManyPhotosICloudOnlyOffline | grep -av "PREVIEW_JPEG"
          status=${PIPESTATUS[0]}
          kill "$WATCHDOG" "$SAMPLER" "$TICKER" 2>/dev/null
          sleep 2
          pkill -f "tail -n \+1 -F $LOG" 2>/dev/null
          echo "STRESS_TIME $(( $(date +%s) - started )) s"
          for phase in prepare create measure; do
            awk -v p="$phase" '$3 == p' memory.txt | sort -k2 -n | tail -1 | awk -v p="$phase" '{printf "STRESS_MEMORY_MAX %s %d MB\n", p, $2/1024}'
          done
          tail -1 memory.txt | awk '{printf "STRESS_MEMORY_END %d MB (%s)\n", $2/1024, $3}'
          # Why the app ended, if it did: iOS's reason (RunningBoard, jetsam), the app's own
          # markers and its main-thread stalls (-SortlyUITestWatchMain), crash reports in the
          # simulator, and the result bundle.
          xcrun simctl spawn "$UDID" log show --last 3h --style compact --predicate 'eventMessage CONTAINS "UITEST_"' 2>/dev/null | grep -av UITEST_MAIN_BLOCKED | cut -c 1-300 | tail -80 | sed 's/^/STRESS_LOG /'
          xcrun simctl spawn "$UDID" log show --last 3h --style compact --predicate 'eventMessage CONTAINS "UITEST_MAIN_BLOCKED"' 2>/dev/null | grep -a "UITEST_MAIN_BLOCKED" > main-blocked.txt
          echo "STRESS_MAIN_BLOCKED $(wc -l < main-blocked.txt) times over 1 s"
          sed -E 's/.*UITEST_MAIN_BLOCKED ([0-9]+) ms.*/\1 &/' main-blocked.txt | sort -rn | head -20 | cut -d' ' -f2- | cut -c 1-200 | sed 's/^/STRESS_MAIN_BLOCKED /'
          xcrun simctl spawn "$UDID" log show --last 3h --style compact \
            --predicate '(subsystem == "com.apple.runningboard" OR process == "SpringBoard" OR process == "launchd_sim" OR eventMessage CONTAINS[c] "jetsam") AND eventMessage CONTAINS "albumist"' 2>/dev/null \
            | grep -aiE "termin|exit|kill|jetsam|crash|memory|limit|watchdog|signal" | cut -c 1-300 | tail -60 | sed 's/^/STRESS_END_REASON /'
          find ~/Library/Developer/CoreSimulator/Devices/"$UDID"/data/Library/Logs -name "*.ips" 2>/dev/null | head -10 | while read -r f; do
            echo "STRESS_CRASH_REPORT $f"; head -c 30000 "$f" | sed 's/^/STRESS_CRASH_REPORT /'
          done
          xcrun xcresulttool get test-results tests --path build/stress.xcresult 2>/dev/null | head -c 20000 | sed 's/^/STRESS_RESULT /'
          grep -aE "PREVIEW_JPEG" "$LOG" | head -2000
          exit $status
      - name: Job summary
        if: always()
        env:
          PHOTOS: ${{ inputs.photos }}
        run: |
          args=()
          for log in build/*-log.txt; do [ -f "$log" ] && args+=(--swift-log "$log"); done
          python3 .github/scripts/test_summary.py summary --title "UI stress $PHOTOS photos" "${args[@]}" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-stress-results
          path: |
            build/*.xcresult
            build/*-log.txt
            build/flaky-*.json
            memory.txt
            main-blocked.txt
            sim-boot.log
          retention-days: 7
          if-no-files-found: ignore
