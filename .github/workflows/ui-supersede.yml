name: UI supersede
# A new push to a pull request cancels the UI runs (ui.yml) of its older commits, waiting or
# running (.github/scripts/ui_supersede.py). The Mac queue of ui.yml never cancels a running
# run (one group for all branches), so without this the run of an outdated commit held the
# Macs for up to an hour (PR #9, 19.11.2026: 8d0db8f ran on while 945446e with the fix waited).
#
# Same trigger as ui.yml's pull request runs, so it acts exactly when a newer UI run comes.
# Not in "mac-queue": there it would wait behind the very run it has to cancel. One job per
# pull request at a time; a newer push cancels the job of the older one.
# Never touched: other branches, runs started by hand, runs created after this job's own run (a
# newer push), and TestFlight (its UI flow runs inside testflight.yml and is not a run of ui.yml;
# a head branch main is refused). A re-run of an older commit's run is cancelled like it.
on:
  pull_request:
    paths-ignore: ['**.md']

permissions: {}

concurrency:
  group: ui-supersede-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  supersede:
    name: Cancel the UI runs of older commits
    # Only pull requests from this repository: a fork's (or a deleted fork's) pull request gets no
    # write token, and its runs are in the group "ui-fork".
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cancel the UI runs of older commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/ui_supersede.py
