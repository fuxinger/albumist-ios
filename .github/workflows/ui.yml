name: UI flow

# End-to-end UI tests on the simulator. Separate from CI with its own queue: a new push does
# not cancel a running UI run; the newest commit runs next.
#
#   1. Core tests (Linux): the core library's tests on a free Linux runner. No macOS runner
#      starts for a commit whose core tests fail (fast first, then expensive).
#   2. UI build: builds the app and the UI tests once (build-for-testing) and hands them on.
#   3. Three test groups in parallel, each on its own runner and freshly booted simulator
#      (test-without-building), so the slowest group sets the wall time, not the sum:
#        - full flow:      SortlyFlowUITests/test1_FullFlow (onboarding, demo library, plan,
#                          the sorting-show video), ~21-26 min
#        - other flows:    every other UI test except the accessibility tests (flow tests 2-6,
#                          locked purchase, search; each brings the app to an onboarded demo
#                          library by itself, see UITestOnboarding), ~20-29 min
#        - accessibility:  AccessibilityUITests on a small iPhone with Reduce Motion, then
#                          test5 with Increase Contrast, ~30 min
#      "other flows" is defined as "everything the other two groups do not run", so a new test
#      class always runs somewhere and no test runs twice.
#      With CI's one macOS job this is at most four macOS jobs per push (the build job runs
#      before the groups), out of about five for the whole repository.
#
# Each group runs through .github/scripts/ui_tests.py: a pass that the simulator service lost
# (an explicit "Error returned in reply from CoreSimulatorService", "Timed out waiting for AX
# loaded notification", runner not installed or launched, ...) and in which neither the log,
# a crash report nor the result bundle shows anything about the app is repeated once, on an
# erased and newly prepared simulator, for the tests that did not pass only. A failed test,
# an error line, an accessibility finding, a crash, a timeout or a bare runner restart is
# never repeated, and a pass that ran no test fails. Result bundles and logs are uploaded
# when a group fails.
on:
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-linux:
    # Same tests as CI's "Core tests (Linux)" (CI runs them for this commit too, but a manual
    # UI run on a branch has no CI run to wait for). ~4 min on a free runner.
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SQLite headers
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev > /dev/null
      - name: Build and test
        run: swift test --parallel

  build:
    name: UI build
    needs: core-linux
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Build for testing
        run: |
          set +e
          brew install xcodegen
          cd App && xcodegen generate
          xcodebuild build-for-testing \
            -project Sortly.xcodeproj \
            -scheme SortlyUI \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ../build/dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO > ../build-log.txt 2>&1
          status=$?
          grep -aE "error:|\*\* " ../build-log.txt | grep -v "/SourcePackages/" | head -100
          [ $status = 0 ] || exit $status
          set -e
          # Only what the tests run: the apps and the .xctestrun (no modules or objects).
          cd ../build/dd/Build/Products
          ls
          tar --exclude '*.swiftmodule' --exclude '*.o' --exclude '*.a' --exclude '*.swiftdoc' -czf "$GITHUB_WORKSPACE/ui-products.tgz" .
          ls -la "$GITHUB_WORKSPACE/ui-products.tgz"
      - name: Upload build products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-products
          path: ui-products.tgz
          retention-days: 1
          compression-level: 0
          overwrite: true

  ui:
    name: UI ${{ matrix.title }}
    needs: build
    runs-on: xcode-27
    # A group takes 25-40 min; a repeat after a simulator failure can add up to its length.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # only / skip: "Class" or "Class/testMethod" of SortlyUITests, separated by spaces.
          - group: flow-full
            title: full flow and video
            device: pro
            only: SortlyFlowUITests/test1_FullFlow
            skip: ''
            video: true
          - group: flow-other
            title: other flows, purchase and search
            device: pro
            only: ''
            # Everything the other two groups run (keep in step with them).
            skip: SortlyFlowUITests/test1_FullFlow AccessibilityUITests
          - group: accessibility
            # AccessibilityUITests 1-4 on a small iPhone (SE, 375 pt) with Reduce Motion, then
            # test5 on its own with Increase Contrast and Reduce Transparency switched on, same
            # simulator. These tests fail on findings.
            title: accessibility (small iPhone)
            device: se
            only: AccessibilityUITests
            skip: AccessibilityUITests/test5_IncreasedContrastAndReducedTransparency
            reduce_motion: true
            contrast: AccessibilityUITests/test5_IncreasedContrastAndReducedTransparency
    env:
      GROUP: ${{ matrix.group }}
      DEVICE: ${{ matrix.device }}
      ONLY: ${{ matrix.only }}
      SKIP: ${{ matrix.skip }}
      CONTRAST: ${{ matrix.contrast }}
      REDUCE_MOTION: ${{ matrix.reduce_motion }}
      VIDEO: ${{ matrix.video }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
      - name: Boot simulator (in the background)
        id: sim
        # The first boot of a fresh simulator takes 3-7 min on the hosted Macs; it runs while
        # the build products are downloaded.
        run: |
          UDID=$(python3 .github/scripts/ui_tests.py pick --device "$DEVICE")
          [ -n "$UDID" ] || { echo "no simulator"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          flags=()
          [ "$REDUCE_MOTION" = "true" ] && flags+=(--reduce-motion)
          nohup python3 .github/scripts/ui_tests.py boot --udid "$UDID" "${flags[@]}" --ready-file sim-ready > sim-boot.log 2>&1 &
      - name: Download build products
        # v8 is the download action that pairs with upload-artifact v7 (its README).
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-products
          path: products-download
      - name: Unpack build products
        run: |
          mkdir -p products
          tar -xzf products-download/ui-products.tgz -C products
          ls products
      - name: Wait for the simulator
        run: |
          for _ in $(seq 1 180); do [ -f sim-ready ] && break; sleep 5; done
          cat sim-boot.log
          [ "$(cat sim-ready 2>/dev/null)" = ok ] || { echo "simulator did not boot"; exit 1; }
      - name: Run UI tests
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +e
          XCTESTRUN=$(ls products/*.xctestrun 2>/dev/null | head -1)
          [ -n "$XCTESTRUN" ] || { echo "::error::no .xctestrun in the build products"; exit 1; }
          flags=()
          [ "$REDUCE_MOTION" = "true" ] && flags+=(--reduce-motion --a11y-summary)
          [ "$VIDEO" = "true" ] && flags+=(--video build/sorting-show.mp4)
          python3 .github/scripts/ui_tests.py run --udid "$UDID" --name "$GROUP" --xctestrun "$XCTESTRUN" \
            --only "$ONLY" --skip "$SKIP" "${flags[@]}"
          status=$?
          contrast=0
          if [ -n "$CONTRAST" ]; then
            python3 .github/scripts/ui_tests.py run --udid "$UDID" --name "$GROUP-contrast" --xctestrun "$XCTESTRUN" \
              --only "$CONTRAST" --reduce-motion --increase-contrast --a11y-summary
            contrast=$?
          fi
          [ $status -eq 0 ] && [ $contrast -eq 0 ]
      - name: Job summary
        if: always()
        run: |
          args=()
          for log in build/*-log.txt; do [ -f "$log" ] && args+=(--swift-log "$log"); done
          python3 .github/scripts/test_summary.py summary --title "UI ${{ matrix.title }}" "${args[@]}" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload video of the sorting show
        if: always() && matrix.video && hashFiles('build/sorting-show.mp4') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sorting-show-video
          path: build/sorting-show.mp4
          retention-days: 14
      - name: Upload results
        # Crash logs, screens and attachments of a failed test are in the result bundles.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-results-${{ matrix.group }}
          path: |
            build/*.xcresult
            build/*-log.txt
            build/*-swiftui.txt
            sim-boot.log
          retention-days: 7
          if-no-files-found: ignore
