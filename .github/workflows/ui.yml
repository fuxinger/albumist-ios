name: UI flow

# End-to-end UI tests on the simulator. Separate from CI with its own queue: a new push does
# not cancel a running UI run; the newest commit runs next.
#
#   1. Core tests (Linux): the core library's tests on a free Linux runner. No macOS runner
#      starts for a commit whose core tests fail (fast first, then expensive).
#   2. UI build: builds the app and the UI tests once (build-for-testing) and hands them on.
#   3. Five test groups, each on its own runner and freshly booted simulator
#      (test-without-building), at most four at a time (max-parallel), so the slowest group
#      sets the wall time, not the sum. Job times measured in UI run 43906501407, including
#      5-7 min simulator setup (device conditions: UI runs 43827092443 and 43795445305 of
#      claude/pro-switches):
#        - device conditions: DeviceConditionUITests 01-04, 06, 09-12 (hot iPhone, battery,
#                          background expiry, iCloud offline, full disk, photo access, empty
#                          and large library; test12 is the stress test and skips itself here,
#                          see ui-stress.yml), ~65 min
#        - full flow:      SortlyFlowUITests/test1_FullFlow (onboarding, demo library, plan,
#                          the sorting-show video), 32 min
#        - other flows:    every other UI test except the accessibility tests (flow tests 2-6,
#                          locked purchase, search, and DeviceConditionUITests 05, 07, 08: undo
#                          and interrupted plans, flows with a plan like flow test 5; each brings
#                          the app to an onboarded demo library by itself, see
#                          UITestOnboarding), 44 min + ~20 min
#        - accessibility:  AccessibilityUITests 1-4 on a small iPhone with Reduce Motion,
#                          ~48 min (56.5 min with the contrast pass, which is now apart)
#        - contrast:       AccessibilityUITests test5 with Increase Contrast and Reduce
#                          Transparency on its own small iPhone, ~18 min (it onboards first)
#      "other flows" is defined as "everything the other groups do not run", so a new test
#      class always runs somewhere and no test runs twice (test_ui_tests.py GroupTests checks
#      every UI test against the groups).
#      With CI's one macOS job this is at most five macOS jobs per push at the peak (the build
#      job runs before the groups; max-parallel 4 holds the fifth group back), about all the
#      repository has; accepted on 16.11. Contrast is listed last, so it is the group that
#      waits: it starts when the first group (the full flow, ~32 min) is done and ends with
#      the others.
#      The 50,000-photo stress run is not part of this run: .github/workflows/ui-stress.yml,
#      started by hand.
#
# Each group runs through .github/scripts/ui_tests.py: a pass that the simulator service lost
# (an explicit "Error returned in reply from CoreSimulatorService", "Timed out waiting for AX
# loaded notification", runner not installed or launched, ...) and in which neither the log,
# a crash report nor the result bundle shows anything about the app is repeated once, on an
# erased and newly prepared simulator, for the tests that did not pass only. A failed test,
# an error line, an accessibility finding, a crash, a timeout or a bare runner restart is
# never repeated, and a pass that ran no test fails. Result bundles and logs are uploaded
# when a group fails. Nothing is repeated silently: every repeat, every test that passed only
# on it and every failed boot attempt is a FLAKY... line in the group's log and job summary
# and goes into build/flaky-GROUP.json; 4. "UI summary" (Linux) counts them over all groups.
on:
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-linux:
    # Same tests as CI's "Core tests (Linux)" (CI runs them for this commit too, but a manual
    # UI run on a branch has no CI run to wait for). ~4 min on a free runner.
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SQLite headers
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev > /dev/null
      - name: Build and test
        run: swift test --parallel

  build:
    name: UI build
    needs: core-linux
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Xcode
        run: python3 .github/scripts/toolchain.py xcode
      - name: Build for testing
        run: |
          set +e
          brew install xcodegen
          cd App && xcodegen generate
          xcodebuild build-for-testing \
            -project Sortly.xcodeproj \
            -scheme SortlyUI \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ../build/dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO > ../build-log.txt 2>&1
          status=$?
          grep -aE "error:|\*\* " ../build-log.txt | grep -v "/SourcePackages/" | head -100
          [ $status = 0 ] || exit $status
          set -e
          # Only what the tests run: the apps and the .xctestrun (no modules or objects).
          cd ../build/dd/Build/Products
          ls
          tar --exclude '*.swiftmodule' --exclude '*.o' --exclude '*.a' --exclude '*.swiftdoc' -czf "$GITHUB_WORKSPACE/ui-products.tgz" .
          ls -la "$GITHUB_WORKSPACE/ui-products.tgz"
      - name: Upload build products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-products
          path: ui-products.tgz
          retention-days: 1
          compression-level: 0
          overwrite: true

  ui:
    name: UI ${{ matrix.title }}
    needs: build
    runs-on: xcode-27
    # A group takes 25-65 min; a repeat after a simulator failure can add up to its length.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Four groups + CI's macOS job = five macOS jobs at the peak (see the top of this file).
      max-parallel: 4
      matrix:
        include:
          # only / skip: "Class" or "Class/testMethod" of SortlyUITests, separated by spaces.
          - group: device
            # The device-condition switches (App/Sortly/Platform/UITestSwitches.swift) on the Pro
            # simulator. A test that resets the photo access asks the Mac to give it back
            # (UI_HOST_GRANT_PHOTOS, answered by ui_tests.py). DeviceConditionUITests 05, 07 and
            # 08 (undo, interrupted plan) run with the other flows.
            title: device conditions
            device: pro
            only: >-
              DeviceConditionUITests/test01_WarmAndHotPhoneWaitAndFinish
              DeviceConditionUITests/test02_LowBatteryAndLowPowerModeWording
              DeviceConditionUITests/test03_BackgroundExpiryAndRelaunchContinue
              DeviceConditionUITests/test04_UnreadableICloudOfflineComplete
              DeviceConditionUITests/test06_DiskFullDuringAnalysisAndPlan
              DeviceConditionUITests/test09_PhotoAccessDeniedLimitedAndRevoked
              DeviceConditionUITests/test10_EmptyLibrary
              DeviceConditionUITests/test11_LargeLibrary
              DeviceConditionUITests/test12_StressManyPhotosICloudOnlyOffline
            skip: ''
          - group: flow-full
            title: full flow and video
            device: pro
            only: SortlyFlowUITests/test1_FullFlow
            skip: ''
            video: true
          - group: flow-other
            title: other flows, purchase and search
            device: pro
            only: ''
            # Everything the other groups run (keep in step with them; GroupTests checks it).
            skip: >-
              SortlyFlowUITests/test1_FullFlow
              AccessibilityUITests
              DeviceConditionUITests/test01_WarmAndHotPhoneWaitAndFinish
              DeviceConditionUITests/test02_LowBatteryAndLowPowerModeWording
              DeviceConditionUITests/test03_BackgroundExpiryAndRelaunchContinue
              DeviceConditionUITests/test04_UnreadableICloudOfflineComplete
              DeviceConditionUITests/test06_DiskFullDuringAnalysisAndPlan
              DeviceConditionUITests/test09_PhotoAccessDeniedLimitedAndRevoked
              DeviceConditionUITests/test10_EmptyLibrary
              DeviceConditionUITests/test11_LargeLibrary
              DeviceConditionUITests/test12_StressManyPhotosICloudOnlyOffline
          - group: accessibility
            # AccessibilityUITests 1-4 on a small iPhone (SE, 375 pt) with Reduce Motion. These
            # tests fail on findings.
            title: accessibility (small iPhone)
            device: se
            only: AccessibilityUITests
            skip: AccessibilityUITests/test5_IncreasedContrastAndReducedTransparency
            reduce_motion: true
          - group: contrast
            # AccessibilityUITests test5 on its own small iPhone with Reduce Motion, Increase
            # Contrast and Reduce Transparency switched on before the first launch; the test
            # brings the app to an onboarded demo library by itself (onboardAndSeed). Its own job
            # since 16.11. (UI run 43906501407: 8 min after tests 1-4 made accessibility the
            # longest group, 56.5 min).
            title: contrast (small iPhone)
            device: se
            only: AccessibilityUITests/test5_IncreasedContrastAndReducedTransparency
            skip: ''
            reduce_motion: true
            increase_contrast: true
    env:
      GROUP: ${{ matrix.group }}
      DEVICE: ${{ matrix.device }}
      ONLY: ${{ matrix.only }}
      SKIP: ${{ matrix.skip }}
      INCREASE_CONTRAST: ${{ matrix.increase_contrast }}
      REDUCE_MOTION: ${{ matrix.reduce_motion }}
      VIDEO: ${{ matrix.video }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Xcode
        run: python3 .github/scripts/toolchain.py xcode --runtime
      - name: Boot simulator (in the background)
        id: sim
        # The first boot of a fresh simulator takes 3-7 min on the hosted Macs; it runs while
        # the build products are downloaded.
        run: |
          UDID=$(python3 .github/scripts/ui_tests.py pick --device "$DEVICE")
          [ -n "$UDID" ] || { echo "no simulator"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          flags=()
          [ "$REDUCE_MOTION" = "true" ] && flags+=(--reduce-motion)
          nohup python3 .github/scripts/ui_tests.py boot --udid "$UDID" "${flags[@]}" --ready-file sim-ready > sim-boot.log 2>&1 &
      - name: Download build products
        # v8 is the download action that pairs with upload-artifact v7 (its README).
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-products
          path: products-download
      - name: Unpack build products
        run: |
          mkdir -p products
          tar -xzf products-download/ui-products.tgz -C products
          ls products
      - name: Wait for the simulator
        run: |
          for _ in $(seq 1 180); do [ -f sim-ready ] && break; sleep 5; done
          cat sim-boot.log
          [ "$(cat sim-ready 2>/dev/null)" = ok ] || { echo "simulator did not boot"; exit 1; }
      - name: Run UI tests
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +e
          XCTESTRUN=$(ls products/*.xctestrun 2>/dev/null | head -1)
          [ -n "$XCTESTRUN" ] || { echo "::error::no .xctestrun in the build products"; exit 1; }
          flags=()
          [ "$REDUCE_MOTION" = "true" ] && flags+=(--reduce-motion --a11y-summary)
          [ "$INCREASE_CONTRAST" = "true" ] && flags+=(--increase-contrast)
          [ "$VIDEO" = "true" ] && flags+=(--video build/sorting-show.mp4)
          python3 .github/scripts/ui_tests.py run --udid "$UDID" --name "$GROUP" --xctestrun "$XCTESTRUN" \
            --only "$ONLY" --skip "$SKIP" "${flags[@]}"
      - name: Job summary
        if: always()
        run: |
          args=()
          for log in build/*-log.txt; do [ -f "$log" ] && args+=(--swift-log "$log"); done
          python3 .github/scripts/test_summary.py summary --title "UI ${{ matrix.title }}" "${args[@]}" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload video of the sorting show
        if: always() && matrix.video && hashFiles('build/sorting-show.mp4') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sorting-show-video
          path: build/sorting-show.mp4
          retention-days: 14
      - name: Upload results
        # Crash logs, screens and attachments of a failed test are in the result bundles.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-results-${{ matrix.group }}
          path: |
            build/*.xcresult
            build/*-log.txt
            build/*-swiftui.txt
            sim-boot.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the retry record for the run summary
        # build/flaky-*.json: repeats after a simulator failure and the tests that passed only
        # on them (ui_tests.py); the summary job below counts them over all groups.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-flaky-${{ matrix.group }}
          path: build/flaky-*.json
          retention-days: 14
          if-no-files-found: ignore

  summary:
    name: UI summary (retries and flaky tests)
    # Linux only; reads the records of all groups, also of failed ones. It never fails the run:
    # the groups decide that. Nothing that was repeated stays hidden in a single job's log.
    needs: ui
    if: ${{ always() && needs.ui.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Retry records of the groups
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ui-flaky-*
          path: flaky
          merge-multiple: true
      - name: Count repeats and flaky tests
        run: |
          shopt -s nullglob
          python3 .github/scripts/ui_tests.py flaky-summary flaky/*.json >> "$GITHUB_STEP_SUMMARY"
