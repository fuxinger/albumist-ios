name: Albumist
options:
  bundleIdPrefix: app.albumist
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true
  xcodeVersion: "26.0"
packages:
  AlbumistKit:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Albumist:
    type: application
    platform: iOS
    sources:
      - path: Albumist
    dependencies:
      - package: AlbumistKit
        product: AlbumistCore
      - package: AlbumistKit
        product: AlbumistStore
      - package: AlbumistKit
        product: AlbumistEngine
      - package: AlbumistKit
        product: AlbumistWorldMap
      - package: AlbumistKit
        product: AlbumistMap
    info:
      path: Albumist/Resources/Info.plist
      properties:
        CFBundleDisplayName: Albumist
        # Short name: Appetize and some system lists show it.
        CFBundleName: Albumist
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The commit an App Store archive was built from (testflight.yml sets it, "local"
        # otherwise). The upload checks it before it signs and ships the archive.
        AlbumistCommit: $(ALBUMIST_COMMIT)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Version 1: iPhone only, portrait only (Fuchs 15.11.2026: "iPad machen wir in einer
        # späteren Version"); landscape and iPad were never tested (plugin review W5).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Read and write (PHAccessLevel.readWrite): the app reads to suggest and, after the user
        # confirms a plan, creates albums and folders and adds or removes album memberships
        # (App Review 5.1.1(ii): the purpose string names both). English: InfoPlist.xcstrings.
        NSPhotoLibraryUsageDescription: "Albumist analysiert deine Fotos nur auf diesem Gerät, um Alben vorzuschlagen. Erst wenn du bestätigst, legt es Alben und Ordner in der Fotos-App an, fügt Fotos hinzu oder nimmt sie aus Alben heraus. Kein Foto wird hochgeladen, Originale bleiben unverändert."
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - app.albumist.ios.refinement
          - app.albumist.ios.analysis.*
        ITSAppUsesNonExemptEncryption: false
        # A display link may run above 60 Hz on a ProMotion iPhone: the photo grid scrolls by
        # itself with the screen while a finger selects at an edge (design wave 3, review L13).
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.albumist.ios
        TARGETED_DEVICE_FAMILY: "1"
        # Albumist/Resources/AppIcon.icon: the layered Icon Composer icon of iOS 26 (light, dark,
        # clear and tinted from one file; design/icon/README.md). XcodeGen 2.45.1 and later adds a
        # .icon folder as one resource; the asset catalog has no second "AppIcon".
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ALBUMIST_COMMIT: local
  AlbumistTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AlbumistTests
      # The app's product for StoreKit testing (SKTestSession in PurchaseStoreKitTests).
      # Price and product id mirror App Store Connect; the app itself reads the price from StoreKit.
      - path: StoreKit/Albumist.storekit
        buildPhase: resources
    dependencies:
      - target: Albumist
      - package: AlbumistKit
        product: AlbumistTestSupport
    postBuildScripts:
      # StoreKit testing (SKTestSession) recognizes the test host by its code signing
      # identifier. Built with CODE_SIGNING_ALLOWED=NO (CI), the app only carries the
      # linker's signature with the identifier "Albumist", so StoreKit treats it as an
      # unknown app and asks the real App Store: no product, no transactions. Signing the
      # simulator test host ad hoc gives it its bundle id. Never runs for devices or archives.
      - name: Sign test host for StoreKit testing
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PLATFORM_NAME" = "iphonesimulator" ] && [ "$CODE_SIGNING_ALLOWED" != "YES" ] && [ -n "$TEST_HOST" ]; then
            APP="${TEST_HOST%/*}"
            ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
            LOG=$(mktemp)
            # The whole bundle; if a nested part refuses, at least the executable gets the id.
            codesign --force --deep --sign - --timestamp=none "$APP" 2> "$LOG" \
              || codesign --force --sign - --timestamp=none --identifier "$ID" "$TEST_HOST" 2>> "$LOG"
            # Checked, not assumed: with any other identifier StoreKit lists no product and every
            # StoreKit test waits its whole budget for nothing (CI 44340950061 could not tell why,
            # the result of this step was not in the job log). A wrong identifier stops the build.
            SIGNED=$(codesign -dv "$TEST_HOST" 2>&1 | sed -n 's/^Identifier=//p')
            if [ "$SIGNED" = "$ID" ]; then
              echo "note: test host signed ad hoc for StoreKit testing: Identifier=$SIGNED"
            else
              echo "error: AlbumistTests could not sign the test host for StoreKit testing: identifier '$SIGNED', expected '$ID'; $(tr '\n' ' ' < "$LOG")"
              exit 1
            fi
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.albumist.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        # The script above writes into the test host's bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  AlbumistUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AlbumistUITests
    dependencies:
      - target: Albumist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.albumist.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Albumist
schemes:
  Albumist:
    build:
      targets:
        Albumist: all
        AlbumistTests: [test]
    test:
      targets:
        - AlbumistTests
      gatherCoverageData: false
  AlbumistUI:
    build:
      targets:
        Albumist: all
        AlbumistUITests: [test]
    test:
      targets:
        - AlbumistUITests
      gatherCoverageData: false
