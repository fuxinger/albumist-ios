name: Sortly
options:
  bundleIdPrefix: app.albumist
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true
  xcodeVersion: "26.0"
packages:
  SortlyKit:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Sortly:
    type: application
    platform: iOS
    sources:
      - path: Sortly
    dependencies:
      - package: SortlyKit
        product: SortlyCore
      - package: SortlyKit
        product: SortlyStore
      - package: SortlyKit
        product: SortlyEngine
      - package: SortlyKit
        product: SortlyWorldMap
    info:
      path: Sortly/Resources/Info.plist
      properties:
        CFBundleDisplayName: Albumist
        # Short name (the target is still called Sortly): Appetize and some system lists show it.
        CFBundleName: Albumist
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The commit an App Store archive was built from (testflight.yml sets it, "local"
        # otherwise). The upload checks it before it signs and ships the archive.
        AlbumistCommit: $(ALBUMIST_COMMIT)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Version 1: iPhone only, portrait only (Fuchs 15.11.2026: "iPad machen wir in einer
        # späteren Version"); landscape and iPad were never tested (plugin review W5).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Albumist liest deine Fotos nur auf diesem Gerät, um Alben vorzuschlagen. Nichts wird hochgeladen, Originale werden nie verändert."
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - app.albumist.ios.refinement
          - app.albumist.ios.analysis.*
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.albumist.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ALBUMIST_COMMIT: local
  SortlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SortlyTests
      # The app's product for StoreKit testing (SKTestSession in PurchaseStoreKitTests).
      # Price and product id mirror App Store Connect; the app itself reads the price from StoreKit.
      - path: StoreKit/Albumist.storekit
        buildPhase: resources
    dependencies:
      - target: Sortly
      - package: SortlyKit
        product: SortlyTestSupport
    postBuildScripts:
      # StoreKit testing (SKTestSession) recognizes the test host by its code signing
      # identifier. Built with CODE_SIGNING_ALLOWED=NO (CI), the app only carries the
      # linker's signature with the identifier "Sortly", so StoreKit treats it as an
      # unknown app and asks the real App Store: no product, no transactions. Signing the
      # simulator test host ad hoc gives it its bundle id. Never runs for devices or archives.
      - name: Sign test host for StoreKit testing
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PLATFORM_NAME" = "iphonesimulator" ] && [ "$CODE_SIGNING_ALLOWED" != "YES" ] && [ -n "$TEST_HOST" ]; then
            APP="${TEST_HOST%/*}"
            ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
            LOG=$(mktemp)
            # The whole bundle; if a nested part refuses, at least the executable gets the id.
            if codesign --force --deep --sign - --timestamp=none "$APP" 2> "$LOG" \
              || codesign --force --sign - --timestamp=none --identifier "$ID" "$TEST_HOST" 2>> "$LOG"; then
              echo "note: test host signed ad hoc for StoreKit testing: $(codesign -dv "$TEST_HOST" 2>&1 | grep '^Identifier=')"
            else
              echo "warning: SortlyTests could not sign the test host for StoreKit testing: $(tr '\n' ' ' < "$LOG")"
            fi
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.albumist.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        # The script above writes into the test host's bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  SortlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SortlyUITests
    dependencies:
      - target: Sortly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.albumist.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sortly
schemes:
  Sortly:
    build:
      targets:
        Sortly: all
        SortlyTests: [test]
    test:
      targets:
        - SortlyTests
      gatherCoverageData: false
  SortlyUI:
    build:
      targets:
        Sortly: all
        SortlyUITests: [test]
    test:
      targets:
        - SortlyUITests
      gatherCoverageData: false
